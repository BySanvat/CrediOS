<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FCFBF7" />
    <title>CrediOS</title>
    <style>
      :root {
        color: #171615;
        background: #fcfbf7;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at top left, #edf8ef, transparent 36%),
          linear-gradient(180deg, #fcfbf7, #f6f2ec);
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(23, 22, 21, 0.08);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(23, 22, 21, 0.1);
        max-width: 420px;
        padding: 28px;
        text-align: center;
      }

      .mark {
        align-items: center;
        background: #edf8ef;
        border-radius: 18px;
        color: #245c38;
        display: inline-flex;
        font-size: 22px;
        font-weight: 800;
        height: 56px;
        justify-content: center;
        width: 56px;
      }

      h1 {
        font-size: 28px;
        line-height: 1.08;
        margin: 18px 0 10px;
      }

      p {
        color: #6f6965;
        font-size: 15px;
        line-height: 1.6;
        margin: 0;
      }

      a {
        align-items: center;
        background: #edf8ef;
        border: 1px solid rgba(36, 92, 56, 0.14);
        border-radius: 999px;
        color: #245c38;
        display: inline-flex;
        font-weight: 700;
        justify-content: center;
        margin-top: 22px;
        min-height: 48px;
        padding: 0 18px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">C</div>
      <h1>CrediOS</h1>
      <p>
        La app nativa esta preparada para abrir la version segura publicada en Cloudflare. Si no
        carga automaticamente, revisa tu conexion y vuelve a intentarlo.
      </p>
      <a href="https://credios.pages.dev/finanzas">Abrir CrediOS</a>
    </main>
  </body>
</html>
